name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: self-hosted

    #defaults:
      #run:
        #working-directory: environments/preprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "3c2899a3-243c-4bc5-8f29-21b465a26e48" \
            --password "W288Q~muHv-9SffrfTUEOnkUEkuauxSCN5w38cOG" \
            --tenant "c04247ef-3725-47f1-93c2-18778afc86e8"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "5f2215aa-254d-4cd3-ab18-8cdd7a251f56"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init
        working-directory: environments/preprod

      - name: Terraform Validate
        run: terraform validate
        working-directory: environments/preprod

      - name: Terraform Plan
        run: terraform plan
        working-directory: environments/preprod

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Apply ONLY after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: environments/preprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "3c2899a3-243c-4bc5-8f29-21b465a26e48" \
            --password "W288Q~muHv-9SffrfTUEOnkUEkuauxSCN5w38cOG" \
            --tenant "c04247ef-3725-47f1-93c2-18778afc86e8"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "5f2215aa-254d-4cd3-ab18-8cdd7a251f56"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan